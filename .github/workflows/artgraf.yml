name: ArtGraf

on:
  push:
    paths:
      - "artgraf/**"
      - ".github/workflows/artgraf.yml"
  pull_request:
    paths:
      - "artgraf/**"
      - ".github/workflows/artgraf.yml"
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build mingw-w64

      - name: Core tests
        run: |
          cmake -S artgraf -B build-tests -G Ninja -DARTGRAF_BUILD_APP=OFF
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

      - name: Build ArtGraf.exe
        run: |
          cmake -S artgraf -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/artgraf/cmake/mingw-w64-x86_64.cmake
          cmake --build build-win

      - uses: actions/upload-artifact@v4
        with:
          name: ArtGraf-windows-x64
          path: build-win/ArtGraf.exe

  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build ArtGraf.apk
        working-directory: artgraf/android
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ArtGraf-android
          path: artgraf/android/app/build/outputs/apk/release/app-release.apk
