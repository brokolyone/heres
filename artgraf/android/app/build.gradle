plugins {
    id "com.android.application"
}

android {
    namespace "com.artgraf.app"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.artgraf.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                arguments "-DARTGRAF_BUILD_TESTS=OFF", "-DANDROID_STL=c++_shared"
                targets "main"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the local debug key so the APK installs right away (sideloading).
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
