<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script src="../src/core.js"></script>
<script src="../src/cast_case.js"></script>
<script>
// ?m=busts&c=lomax,hollis | ?m=bk&c=hollis | ?m=iso | ?m=talk&c=lomax | ?m=fid&c=...
const q = new URLSearchParams(location.search);
const mode = q.get('m') || 'busts';
const ids = (q.get('c') || 'lomax,hollis,whitfield,crane,park,bell,doyle,morales,holloway').split(',');
const BG = G.RAMP.wood[2], BG2 = G.RAMP.stone[4];
let cv;
function bg(c, w, h) { G.rect(c, 0, 0, w, h, BG2); for (let y = 0; y < h; y += 8) G.rect(c, 0, y, w, 1, G.RAMP.stone[3]); }
if (mode === 'busts') {
  const cols = 5;
  cv = G.makeCanvas(cols * 114, ids.length * 134);
  const c = cv.getContext('2d'); bg(c, cv.width, cv.height);
  ids.forEach((id, r) => {
    const d = G.Cast.defs[id];
    d.emotions.forEach((e, k) => {
      G.Cast.drawBust(c, id, k * 114 + 57, r * 134 + 132, { emo: e, t: 1, flip: q.get('flip') === '1' });
    });
  });
} else if (mode === 'bk') {
  const n = +(q.get('n') || 8);
  cv = G.makeCanvas(4 * 114, Math.ceil(n / 4) * ids.length * 134);
  const c = cv.getContext('2d'); bg(c, cv.width, cv.height);
  ids.forEach((id, r) => {
    for (let k = 0; k < n; k++) {
      const dur = G.Cast.animDuration(id, 'breakdown');
      const row = r * Math.ceil(n / 4) + Math.floor(k / 4);
      G.Cast.drawBust(c, id, (k % 4) * 114 + 57, row * 134 + 132, { emo: 'normal', anim: 'breakdown', animT: dur * (k + 0.5) / n, t: 0.5 });
    }
  });
} else if (mode === 'talk') {
  cv = G.makeCanvas(6 * 114, ids.length * 134);
  const c = cv.getContext('2d'); bg(c, cv.width, cv.height);
  ids.forEach((id, r) => {
    const ts = [0.5, 0.63, 0.76, 0.2 + 0.0, 0.25, 0.35];
    const opts = [{ talking: true, t: 0.51 }, { talking: true, t: 0.64 }, { talking: true, t: 0.76 }, { t: 3.5 }, { t: 3.52 }, { t: q.get('ft') ? +q.get('ft') : 5 }];
    opts.forEach((o, k) => G.Cast.drawBust(c, id, k * 114 + 57, r * 134 + 132, Object.assign({ emo: q.get('e') || 'normal' }, o)));
  });
} else if (mode === 'fid') {
  const n = 8;
  cv = G.makeCanvas(n * 114, ids.length * 134);
  const c = cv.getContext('2d'); bg(c, cv.width, cv.height);
  ids.forEach((id, r) => {
    const d = G.Cast.defs[id];
    for (let k = 0; k < n; k++) G.Cast.drawBust(c, id, k * 114 + 57, r * 134 + 132, { emo: q.get('e') || 'normal', t: 0.3, fidget: (k + 0.5) / n });
  });
} else if (mode === 'iso') {
  const reacts = [null, 'talk', 'sit', 'whisper', 'gasp', 'murmur', 'angry', 'cheer', 'clap', 'laugh', 'shout', 'bk'];
  cv = G.makeCanvas(reacts.length * 24 * 2 + 8, ids.length * 36 + 8);
  const c = cv.getContext('2d'); bg(c, cv.width, cv.height);
  ids.forEach((id, r) => {
    reacts.forEach((re, k) => {
      for (let f = 0; f < 2; f++) {
        const o = { pose: 'stand', dir: f ? 'r' : 'l', t: 0.2 + f * 0.37 };
        if (re === 'talk') o.talking = true;
        else if (re === 'sit') o.pose = 'sit';
        else if (re === 'bk') o.emo = 'breakdown';
        else if (re) { o.react = re; o.reactT = 0.1 + f * 0.27; o.pose = 'sit'; }
        G.Cast.drawIso(c, id, 14 + (k * 2 + f) * 24, r * 36 + 38, o);
      }
    });
  });
}
window.__shotCanvas = cv;
G.mountCanvas();
G.renderOnce(c => c.drawImage(cv, 0, 0));
window.__ready = true;
</script>
