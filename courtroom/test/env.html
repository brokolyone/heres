<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script src="../src/core.js"></script>
<script src="../src/env.js"></script>
<script>
G.mountCanvas();
const q = new URLSearchParams(location.search);
const cam = q.get('cam') || 'wide', t = +(q.get('t') || 3), ppl = q.get('ppl') !== '0';
G.renderOnce(c => {
  G.applyCam(c, G.Env.cams[cam]);
  G.Env.drawWorld(c, 'back', t);
  if (ppl) {
    const S = G.Env.spots;
    const all = [];
    for (const k of Object.keys(S)) { if (Array.isArray(S[k])) S[k].forEach(s => all.push(s)); else all.push(S[k]); }
    all.sort((a, b) => a.y - b.y);
    for (const s of all) {
      const h = s.pose === 'sit' ? 14 : 26;
      G.rect(c, s.x - 5, s.y - h, 10, h, G.RAMP.red[4]);
      G.rect(c, s.x - 3, s.y - h - 1, 6, 6, G.RAMP.skinL[3]);
      G.rect(c, s.x - 5, s.y - h + 6, 10, 1, G.RAMP.red[2]);
    }
  }
  G.Env.drawWorld(c, 'front', t);
});
window.__ready = true;
</script>
