<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<script src="../src/core.js"></script>
<script>window.__noCast = /nocast/.test(location.search);</script>
<script src="../src/env.js"></script>
<script src="../src/cast_main.js"></script>
<script src="../src/font.js"></script>
<script src="../src/ui.js"></script>
<script>
const q=new URLSearchParams(location.search); const v=q.get('v')||'dialog'; const T=+(q.get('t')||0.5);
G.mountCanvas(); G.Save.load();
G.Save.data.solved={violin:true};
const EV=[{id:'logbook',icon:'logbook',name:'Журнал охраны',desc:'Журнал ночного дежурства консерватории. Последняя запись: *23:40* — «обход завершён, всё в порядке».',doc:{title:'Журнал дежурств',lines:['14.10.2025','22:15 — сигнализация отключена (код 4471).','23:40 — обход завершён, всё в порядке. *Подпись: П. Холлис*'],stamps:[{text:'ПРИОБЩЕНО',x:170,y:150,color:G.PAL.stampBlue,angle:-12}],signature:'П. Холлис'}},
{id:'photo',icon:'photo',name:'Фото места',desc:'Снимок футляра.'},{id:'key',icon:'key',name:'Ключ',desc:'Ключ от служебного входа.'},{id:'violin',icon:'violin',name:'Скрипка',desc:'Гварнери 1741 г.'},{id:'receipt',icon:'receipt',name:'Чек',desc:'Чек из кафе.'}];
const S={dialog(c){c.drawImage(G.makeSprite(384,216,x=>{G.rect(x,0,0,384,216,G.RAMP.carpet[2])}),0,0);
  G.UI.drawCredibility(c,4,4,3,5,0.05,{flashLost:true});
  G.UI.drawDialog(c,{name:'Питер Холлис',text:'Я видел его *своими глазами*!{p} Он вышел через служебный вход ровно в 23:40, с футляром для скрипки под мышкой. Клянусь, это был он, мистер Ломакс.',shown:400,waiting:true,t:0});
  G.UI.drawSpeech&&G.UI.drawSpeech(c,80,60,'Не может быть!',0.5);
  G.UI.button(c,{x:10,y:40,w:80,h:16},'Обычная');G.UI.button(c,{x:100,y:40,w:80,h:16},'Главная',{kind:'primary'});G.UI.button(c,{x:190,y:40,w:80,h:16},'Опасно',{kind:'danger'});G.UI.button(c,{x:280,y:40,w:80,h:16},'Нельзя',{disabled:true});
 },
 record(c){S.dialog(c);G.UI.courtRecord(c,{sel:0,mode:'present'},EV,0.1);},
 doc(c){G.UI.drawDocument(c,EV[0].doc,0);},
 shout(c){S.dialog(c);G.UI.drawShout(c,q.get('k')||'objection',T);},
 stamp(c){G.rect(c,0,0,384,216,G.RAMP.paper[4]);G.UI.drawStamp(c,100,50,'ОПРАВДАН',G.PAL.stamp,{angle:-12});G.UI.drawStamp(c,260,60,'СЕКРЕТНО',G.PAL.stampBlue,{angle:8,size:'big'});G.UI.drawStamp(c,190,150,'ПРОТЕСТ\nОТКЛОНЁН',G.PAL.stampBlue,{angle:5,size:'shout'});},
 choice(c){S.dialog(c);G.UI.choice(c,'Что противоречит показаниям свидетеля?',['Время в журнале','Погода','Его фуражка'],0);},
 hud(c){S.dialog(c);G.UI.crossHUD(c,{title:'Ночь кражи',index:1,total:5,t:0});},
 wipe(c){S.dialog(c);G.UI.drawWipe(c,T,q.get('k')||'blinds');},
 item(c){S.dialog(c);G.UI.drawItemGet(c,EV[+(q.get('i')||0)],T);},
};
const scenes={title:'TitleScene',select:'CaseSelectScene',settings:'SettingsScene',credits:'CreditsScene'};
if(scenes[v]){const sc=G.UI[scenes[v]];G.scene=sc;sc.enter();for(let i=0;i<Math.round(T*60);i++)sc.update(1/60);G.renderOnce(c=>sc.draw(c));}
else G.renderOnce(c=>S[v](c));
window.__ready=true;
</script>
