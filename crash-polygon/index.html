<style>
/* Layout: a clean camera frame. Wordmark top-left, timecode top-right, speed bottom-right,
   test line bottom-left. No panels: type sits on the footage with a soft shadow. */
:root{
  --ink:#f1efe8;                 /* text on footage */
  --dim:rgba(241,239,232,.62);   /* secondary text */
  --hazard:#e6b01e;              /* test-ground yellow: mark and verdicts only */
  --bad:#e0543a;
  --ok:#9cc46e;
  --sheet:rgba(16,17,16,.86);    /* protocol lower third */
  --shadow:0 1px 2px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.28);
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8f9599;color:var(--ink);font-family:var(--cond);font-size:14px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.locked #gl{cursor:none}
body:not(.live) .hud{display:none!important}
.hud{position:fixed;z-index:2;pointer-events:none;text-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
.mark{display:inline-block;width:30px;height:18px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 5px,#141413 5px 10px);box-shadow:0 1px 3px rgba(0,0,0,.35)}

#brand{top:24px;left:28px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:.06em}

#tc{top:26px;right:30px;font-family:var(--mono);font-size:12.5px;text-align:right;line-height:1.7;color:var(--ink)}
#tc .rec{color:var(--bad)}
#toast{opacity:0;transition:opacity .3s}
#toast.on{opacity:1}

#speedo{right:30px;bottom:24px;display:flex;align-items:flex-end;gap:14px}
#spd{font-weight:600;font-size:84px;line-height:.82;letter-spacing:-.02em;min-width:2.1ch;text-align:right}
#speedo .side{display:flex;flex-direction:column;gap:4px;padding-bottom:2px;font-family:var(--mono);font-size:12px;color:var(--dim)}
#gear{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1;color:var(--ink)}
#eng{color:var(--hazard)}
#eng.bad{color:var(--bad)}
#dmg{width:44px;height:80px;margin-right:4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

#testline{left:28px;bottom:26px;font-size:17px;font-weight:500;display:flex;gap:14px;align-items:baseline;opacity:0;transition:opacity .35s}
#testline.on{opacity:1}
#testline b{font-weight:600}
#mode{font-family:var(--mono);font-size:12.5px;color:var(--dim)}

#help{left:28px;bottom:70px;font-family:var(--mono);font-size:12.5px;line-height:1.85;display:grid;grid-template-columns:auto auto;gap:0 18px}
#help span:nth-child(odd){color:var(--ink)}#help span:nth-child(even){color:var(--dim)}

#report{left:0;right:0;bottom:0;background:var(--sheet);text-shadow:none;border-top:1px solid rgba(241,239,232,.12);
  display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(320px,1.3fr);gap:36px;align-items:center;padding:18px 30px 20px}
#report .head{display:flex;flex-direction:column;gap:6px;min-width:0}
#rtitle{font-family:var(--mono);font-size:12px;color:var(--dim)}
#rsub{font-size:22px;font-weight:600;line-height:1.1}
#verdict{font-size:15px;font-weight:700;letter-spacing:.08em}
#pulse{width:420px;height:96px;display:block}
#report dl{margin:0;display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;justify-content:start}
#report dl div{display:flex;flex-direction:column;gap:2px}
#report dt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
#report dd{margin:0;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#report .close{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}

#intro{position:fixed;inset:0;z-index:5;cursor:pointer;background:linear-gradient(90deg,rgba(12,13,12,.78) 0%,rgba(12,13,12,.5) 45%,rgba(12,13,12,.05) 80%);
  display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 8vw;text-shadow:var(--shadow)}
#intro .word{display:flex;align-items:center;gap:22px}
#intro .mark{width:64px;height:42px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#141413 10px 20px)}
#intro h1{margin:0;font-weight:700;font-size:clamp(64px,9vw,148px);line-height:.9;letter-spacing:.03em}
#intro p{margin:0;max-width:56ch;font-size:18px;line-height:1.45;color:var(--ink)}
#intro .keys{display:grid;grid-template-columns:repeat(2,max-content 14ch);gap:7px 16px;justify-content:start;font-family:var(--mono);font-size:13px;max-width:720px}
#intro .keys span:nth-child(odd){color:var(--hazard)}#intro .keys span:nth-child(even){color:var(--dim)}
#start{all:unset;cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--ink);border-bottom:1px solid var(--hazard);padding-bottom:3px;align-self:flex-start}
#start:focus-visible{outline:2px solid var(--hazard);outline-offset:6px}
@media (max-width:1100px){#report{grid-template-columns:1fr auto;gap:14px 28px}#report dl{grid-column:1/-1}#pulse{width:360px;height:82px}}
@media (prefers-reduced-motion:reduce){#toast,#testline{transition:none}}
</style>

<canvas id="gl" tabindex="-1"></canvas>

<div class="hud" id="brand"><span class="mark"></span></div>


<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';
// 3D models live in ./models (one module per owner, shared frame in models/common.js and models/SPEC.md)
import { CG, ZF, ZR, WHEELS, bodySection } from './models/common.js';
// Each module loads on its own: if one fails to load, its frozen copy in models/baseline/ is used instead.
async function loadModel(name){ try{ return await import('./models/'+name+'.js'); }catch(e){ console.error('model module failed to load: '+name+' → baseline used', e); return import('./models/baseline/'+name+'.js'); } }
const ENV_BASE=await import('./models/baseline/environment.js');
const [ENV_RAW,{createEngineBay},{createFluids},{createWheel,createSuspension},{createInterior}]=await Promise.all(['environment','engine','fluids','wheels','interior'].map(loadModel));
// environment factories fall back to the baseline model one by one if they throw
const ENV=new Proxy({}, { get(_,k){ const f=ENV_RAW[k], b=ENV_BASE[k]; if(typeof f!=='function') return f!==undefined?f:b;
  return (...a)=>{ try{ return f(...a); }catch(e){ console.error('environment model failed: '+k+' → baseline used',e); return b(...a); } }; } });
// a module that throws at runtime is reported once and switched off, the game keeps running
const _modErr=new Set();
function guard(name,mod){ if(!mod) return mod; for(const k of ['update','onImpact','onBreak','dispose']){ const f=mod[k]; if(typeof f!=='function') continue;
  mod[k]=function(...a){ if(_modErr.has(name+k)) return; try{ return f.apply(mod,a); }catch(e){ _modErr.add(name+k); console.error('model module error: '+name+'.'+k,e); } }; } return mod; }

// ───────────────────────────── helpers
const clamp=(x,a,b)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
function pw(z,k){ if(z<=k[0][0]) return k[0][1]; for(let i=1;i<k.length;i++){ if(z<=k[i][0]){ const t=(z-k[i-1][0])/(k[i][0]-k[i-1][0]); return lerp(k[i-1][1],k[i][1],t);} } return k[k.length-1][1]; }
function hash3(x,y,z){ const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return h-Math.floor(h); }
const fall=(e,band)=> e<=0?1:(e>=band?0:(1-e/band)*(1-e/band));
// the page shows no text at all: HUD elements the logic writes to are detached stand-ins
const _off={}; const $=id=>document.getElementById(id)||(_off[id]||(_off[id]=document.createElement(id==='dmg'||id==='pulse'?'canvas':'div')));

// ───────────────────────────── renderer / scene
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=0.92;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=new THREE.Color(0xa7adaf);
scene.fog=new THREE.Fog(FOG,80,460);
scene.background=FOG;
const camera=new THREE.PerspectiveCamera(58,1,0.1,900);

// sky dome + env map
function skyMesh(){
  const g=new THREE.SphereGeometry(600,24,12);
  const m=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{},
    vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 vP;void main(){float h=vP.y;vec3 hor=vec3(.66,.69,.70),top=vec3(.42,.50,.58),gr=vec3(.28,.27,.24);vec3 c=h>0.?mix(hor,top,pow(h,.6)):mix(hor,gr,clamp(-h*6.,0.,1.));float s=pow(max(dot(vP,normalize(vec3(.45,.55,-.7))),0.),60.);c+=vec3(1.,.93,.8)*s*.7;gl_FragColor=vec4(c,1.);}'});
  return new THREE.Mesh(g,m);
}
scene.add(skyMesh());
{ const pm=new THREE.PMREMGenerator(renderer); const es=new THREE.Scene(); es.add(skyMesh()); scene.environment=pm.fromScene(es,0.03).texture; }

const hemi=new THREE.HemisphereLight(0xd3dade,0x5d5848,0.9); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0da,2.3);
sun.position.set(30,40,-38); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-38;sc.right=38;sc.top=38;sc.bottom=-38;sc.near=1;sc.far=140;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target);

// ───────────────────────────── canvas textures
function canvasTex(w,h,draw,repeat){ const c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); draw(x,w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy(); if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t; }
function speckle(x,w,h,n,cols,smin,smax){ for(let i=0;i<n;i++){ x.fillStyle=cols[(Math.random()*cols.length)|0]; const s=rnd(smin,smax); x.fillRect(Math.random()*w,Math.random()*h,s,s);} }
const concreteTex=canvasTex(512,512,(x,w,h)=>{
  x.fillStyle='#8e8b84';x.fillRect(0,0,w,h);
  speckle(x,w,h,26000,['rgba(60,58,54,.10)','rgba(200,196,186,.10)','rgba(110,106,98,.18)'],1,2.4);
  for(let i=0;i<14;i++){ const g=x.createRadialGradient(rnd(0,w),rnd(0,h),0,rnd(0,w),rnd(0,h),rnd(40,140)); g.addColorStop(0,'rgba(70,66,58,.10)'); g.addColorStop(1,'rgba(70,66,58,0)'); x.fillStyle=g; x.fillRect(0,0,w,h);}
  x.strokeStyle='rgba(40,38,34,.55)'; x.lineWidth=2; x.strokeRect(1,1,w-2,h-2);
  x.strokeStyle='rgba(40,38,34,.25)'; x.lineWidth=1; for(let i=0;i<5;i++){ x.beginPath(); let px=rnd(0,w),py=rnd(0,h); x.moveTo(px,py); for(let k=0;k<6;k++){px+=rnd(-30,30);py+=rnd(-30,30);x.lineTo(px,py);} x.stroke(); }
},true);
concreteTex.repeat.set(400/7,400/7);
const grassTex=canvasTex(256,256,(x,w,h)=>{ x.fillStyle='#6b6f4f';x.fillRect(0,0,w,h); speckle(x,w,h,9000,['rgba(90,96,60,.5)','rgba(120,116,80,.45)','rgba(70,70,48,.5)','rgba(140,130,96,.3)'],1,3); },true);
grassTex.repeat.set(220,220);
const hazardTex=ENV.hazardTex;
const puffTex=new THREE.CanvasTexture((()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.5,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c;})());

// ───────────────────────────── physics world
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-9.82,0)});
world.broadphase=new CANNON.SAPBroadphase(world);
world.allowSleep=true;
world.solver.iterations=12;
const mGround=new CANNON.Material('ground'), mCar=new CANNON.Material('car'), mProp=new CANNON.Material('prop');
world.defaultContactMaterial.friction=0.35; world.defaultContactMaterial.restitution=0.05;
world.addContactMaterial(new CANNON.ContactMaterial(mCar,mGround,{friction:0.45,restitution:0.02}));
world.addContactMaterial(new CANNON.ContactMaterial(mCar,mCar,{friction:0.3,restitution:0.06}));
world.addContactMaterial(new CANNON.ContactMaterial(mProp,mGround,{friction:0.6,restitution:0.15}));
world.addContactMaterial(new CANNON.ContactMaterial(mCar,mProp,{friction:0.3,restitution:0.1}));

const obstacles=new Map();   // body.id -> obstacle description for crush shaping
const props=[];              // dynamic props: {mesh, body}

// ground: a box (cannon Plane has a stale AABB issue with raycasts)
const groundBody=new CANNON.Body({mass:0,material:mGround,shape:new CANNON.Box(new CANNON.Vec3(400,1,400))});
groundBody.position.set(0,-1,0); world.addBody(groundBody);
obstacles.set(groundBody.id,{kind:'sphere',R:0.75,hard:0.75,mass:Infinity,ground:true});

const STD=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0.0,flatShading:true},o));
{ // concrete pad + grass
  const pad=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({map:concreteTex,roughness:0.93}));
  pad.rotation.x=-Math.PI/2; pad.receiveShadow=true; pad.scale.set(0.6,0.75,1); concreteTex.repeat.set(240/7,300/7); scene.add(pad);
  const grass=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}));
  grass.rotation.x=-Math.PI/2; grass.position.y=-0.02; grass.receiveShadow=true; scene.add(grass);
}

// ───────────────────────────── markings (runway with lanes, distance marks, skidpad)
const LANES={wall:0, offset:4.18, pole:-16, side:18};
const RUNWAY={x0:-26,x1:28,z0:-78,z1:64};
{
  const W=RUNWAY.x1-RUNWAY.x0, L=RUNWAY.z1-RUNWAY.z0, ppm=12;
  const tex=canvasTex(Math.round(W*ppm),Math.round(L*ppm),(x,w,h)=>{
    x.clearRect(0,0,w,h);
    const X=v=>(v-RUNWAY.x0)*ppm, Z=v=>(RUNWAY.z1-v)*ppm;
    // darker asphalt lanes
    for(const lx of [LANES.wall,LANES.pole,LANES.side]){ x.fillStyle='rgba(52,52,50,.55)'; x.fillRect(X(lx-3.4),0,6.8*ppm,h); }
    x.fillStyle='rgba(235,232,220,.82)';
    for(const lx of [LANES.wall,LANES.pole,LANES.side]){ x.fillRect(X(lx-3.4),0,0.15*ppm,h); x.fillRect(X(lx+3.25),0,0.15*ppm,h);
      for(let z=RUNWAY.z0+2;z<RUNWAY.z1-4;z+=6){ x.fillRect(X(lx-0.06),Z(z+3),0.12*ppm,3*ppm); } }
    // offset lane guide (dashed yellow)
    x.fillStyle='rgba(227,174,28,.9)'; for(let z=RUNWAY.z0+2;z<RUNWAY.z1-4;z+=4){ x.fillRect(X(LANES.offset-0.05),Z(z+2),0.1*ppm,2*ppm); }
    // distance marks to barrier
    x.font=`600 ${Math.round(1.6*ppm)}px "IBM Plex Mono", monospace`; x.textAlign='center'; x.textBaseline='middle';
    for(const lx of [LANES.wall,LANES.pole,LANES.side]){ const tz= lx===LANES.wall?61: lx===LANES.pole?60.13:61.1;
      for(let d=10;d<=130;d+=10){ const z=tz-d; if(z<RUNWAY.z0+1) break; x.fillStyle='rgba(235,232,220,.8)'; x.fillRect(X(lx-3.4),Z(z)-1,6.8*ppm*0.2,0.2*ppm); x.fillRect(X(lx+3.4)-6.8*ppm*0.2,Z(z)-1,6.8*ppm*0.2,0.2*ppm);
        }
      // release line
      x.fillStyle='rgba(227,174,28,.95)'; x.fillRect(X(lx-3.4),Z(tz-5.15)-2,6.8*ppm,0.3*ppm);
    }
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:0.9,polygonOffset:true,polygonOffsetFactor:-1,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.set((RUNWAY.x0+RUNWAY.x1)/2,0.005,(RUNWAY.z0+RUNWAY.z1)/2); m.receiveShadow=true; scene.add(m);
  // skidpad ring
  const ring=new THREE.Mesh(new THREE.RingGeometry(17.9,18.1,96),new THREE.MeshBasicMaterial({color:0xe6e2d6,transparent:true,opacity:.75,depthWrite:false}));
  ring.rotation.x=-Math.PI/2; ring.position.set(-58,0.006,-20); scene.add(ring);
  const ring2=ring.clone(); ring2.geometry=new THREE.RingGeometry(9.9,10.1,64); ring2.position.copy(ring.position); scene.add(ring2);
}

// ───────────────────────────── static obstacles
function addStatic(mesh,shape,pos,quat,ob){
  const b=new CANNON.Body({mass:0,material:mGround}); b.addShape(shape); b.position.copy(pos); if(quat) b.quaternion.copy(quat); world.addBody(b);
  if(mesh){ mesh.position.copy(pos); if(quat) mesh.quaternion.copy(quat); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); }
  if(ob) obstacles.set(b.id,Object.assign({body:b,mass:Infinity},ob)); return b;
}
function boxOb(half,hard){ return {kind:'box',half:new CANNON.Vec3(half.x,half.y,half.z),hard}; }
{ // crash barrier
  const half=new CANNON.Vec3(4,1.5,1.2);
  addStatic(ENV.barrier(),new CANNON.Box(half),new CANNON.Vec3(0,1.5,62.2),null,boxOb(half,0.78));
}
function addPole(x,z,r,h,col,hard=1.15){ return addStatic(ENV.pole(r,h,col),new CANNON.Cylinder(r,r,h,10),new CANNON.Vec3(x,h/2,z),null,{kind:'cyl',r,hard}); }
addPole(LANES.pole,60.13+0.127,0.127,3.2,0x6f7477);
// light masts around the pad (can be hit)
for(const [x,z] of [[-40,-70],[40,-70],[-40,10],[40,10],[-40,72],[40,72],[-80,-40],[-80,30]]){
  addPole(x,z,0.16,9,0x7d8184,1.0);
  const head=ENV.lampHead(); head.position.set(x,9.05,z); scene.add(head);
}
{ // jersey barriers along the east edge
  for(let i=0;i<14;i++){ const z=-60+i*4.0, x=44+Math.sin(i*0.35)*1.2; const half=new CANNON.Vec3(0.22,0.405,1.95);
    const q=new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(0,1,0),Math.cos(i*0.35)*0.08);
    addStatic(ENV.jersey(),new CANNON.Box(half),new CANNON.Vec3(x,0.405,z),q,boxOb(half,0.8)); }
}
{ // launch ramp and a one-sided kicker (rollover)
  const h1=new CANNON.Vec3(2.6,0.3,7); const q1=new CANNON.Quaternion(); q1.setFromEuler(-0.21,0,0);
  addStatic(ENV.ramp(5.2,0.6,14),new CANNON.Box(h1),new CANNON.Vec3(-58,0.95,-75),q1,boxOb(h1,0.7));
  const h2=new CANNON.Vec3(1.0,0.25,3.2); const q2=new CANNON.Quaternion(); q2.setFromEuler(-0.25,0,0.38);
  addStatic(ENV.ramp(2,0.5,6.4),new CANNON.Box(h2),new CANNON.Vec3(-70,0.45,30),q2,boxOb(h2,0.7));
  const stripeQ=new THREE.Mesh(new THREE.PlaneGeometry(5.2,0.4),new THREE.MeshStandardMaterial({map:hazardTex})); stripeQ.rotation.x=-Math.PI/2; stripeQ.position.set(-58,0.012,-82.2); scene.add(stripeQ);
}
{ // hangar, tower, containers — background structures, also solid
  const hg=ENV.hangar(); hg.position.set(-75,0,-118); scene.add(hg);
  const hb=new CANNON.Body({mass:0}); hb.addShape(new CANNON.Box(new CANNON.Vec3(17,6,11))); hb.position.set(-75,6,-118); world.addBody(hb); obstacles.set(hb.id,{kind:'box',body:hb,half:new CANNON.Vec3(17,6,11),hard:0.8,mass:Infinity});
  const tw=ENV.tower(); tw.position.set(36,0,90); scene.add(tw);
  const cols=[0x8a4a33,0x3f5d6a,0x7a7a52,0x5c4b3c];
  [[60,-30,0],[60,-30,2.6],[60,-17.5,0],[66,-24,0]].forEach(([x,z,y],i)=>{ const half=new CANNON.Vec3(1.22,1.3,6.06);
    addStatic(ENV.container(cols[i%4]),new CANNON.Box(half),new CANNON.Vec3(x,1.3+y,z),null,boxOb(half,0.75)); });
}
ENV.scenery(scene);

// ───────────────────────────── dynamic props: cones, drums, tyre stacks
function addProp(mesh,shape,pos,mass,quatOff){

const AU={on:false};
function initAudio(){
  if(AU.on) return; const AC=new (window.AudioContext||window.webkitAudioContext)(); AU.ac=AC; AU.on=true;
  const comp=AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6; comp.connect(AC.destination);
  AU.master=AC.createGain(); AU.master.gain.value=0.75; AU.master.connect(comp);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=nb;
  const loopNoise=()=>{const s=AC.createBufferSource(); s.buffer=nb; s.loop=true; s.start(); return s;};
  // engine: two detuned saws + square sub through lowpass
  AU.eGain=AC.createGain(); AU.eGain.gain.value=0; AU.eFilt=AC.createBiquadFilter(); AU.eFilt.type='lowpass'; AU.eFilt.Q.value=2.5;

  const g3=AC.createGain(); g3.gain.value=0.5; [AU.o1,AU.o2].forEach(o=>{o.connect(AU.eFilt);o.start();}); AU.o3.connect(g3).connect(AU.eFilt); AU.o3.start();
  AU.eFilt.connect(AU.eGain).connect(AU.master);
  // tyres
  AU.tGain=AC.createGain(); AU.tGain.gain.value=0; const tf=AC.createBiquadFilter(); tf.type='bandpass'; tf.frequency.value=1150; tf.Q.value=4; loopNoise().connect(tf).connect(AU.tGain).connect(AU.master);
  // wind

}
function burst(t,dur,gain,type,freq,q){ const AC=AU.ac; const s=AC.createBufferSource(); s.buffer=AU.noise; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=AC.createGain(); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur); s.connect(f).connect(g).connect(AU.master); s.start(t,Math.random()*1.5); s.stop(t+dur+0.05); }

// ───────────────────────────── car body generation (loft)
const NST=36;   // CG, ZF, ZR, WHEELS come from models/common.js
function arch(z){ let a=-1; for(const zw of [1.33,-1.28]){ const d=Math.abs(z-zw); if(d<0.45) a=Math.max(a,0.33+Math.sqrt(0.45*0.45-d*d)*0.93); } return a; }
function station(z){
  const yb=pw(z,[[-2.15,0.36],[-1.95,0.24],[1.85,0.22],[2.15,0.34]]);
  const ytop=pw(z,[[-2.15,0.84],[-2.0,0.97],[-1.62,1.0],[-1.0,1.36],[-0.55,1.41],[0.15,1.40],[0.95,0.96],[1.85,0.87],[2.15,0.74]]);
  const ybelt=Math.min(pw(z,[[-2.15,0.76],[-2.0,0.9],[2.0,0.8],[2.15,0.66]]),ytop-0.03);
  const w=pw(z,[[-2.15,0.79],[-2.0,0.87],[-1.6,0.89],[1.6,0.885],[2.0,0.84],[2.15,0.74]]);
  const c=pw(z,[[-2.15,0],[-1.62,0],[-1.0,1],[0.15,1],[0.95,0],[2.15,0]]);
  return {yb,ytop,ybelt,w,wt:lerp(w-0.07,0.66,c)};
}
function ringAt(z){ const s=station(z); const P=[[0,s.yb],[s.w-0.14,s.yb],[s.w-0.01,s.yb+0.12],[s.w,lerp(s.yb,s.ybelt,0.38)],[s.w,lerp(s.yb,s.ybelt,0.7)],[s.w-0.01,s.ybelt-0.045],[s.w-0.04,s.ybelt],[s.wt,s.ytop-0.045],[s.wt*0.76,s.ytop-0.012],[0,s.ytop]];
  const a=arch(z); if(a>0){ for(let k=1;k<=4;k++) P[k][1]=Math.max(P[k][1],a+k*0.012); P[0][1]=Math.max(P[0][1],a-0.15); }
  const R=P.map(p=>[p[0],p[1]]); for(let k=8;k>=1;k--) R.push([-P[k][0],P[k][1]]); return R; }
const RN=18;
const VT=(()=>{ const r=ringAt(0); const cum=[0]; for(let j=0;j<RN;j++){ const a=r[j],b=r[(j+1)%RN]; cum.push(cum[j]+Math.hypot(a[0]-b[0],a[1]-b[1])); } return cum.map(c=>c/cum[RN]); })();
const segS=j=> j<=8?j:17-j, segSide=j=> j<=8?1:-1;
function classify(zc,s,side){
  const L=side>0?'L':'R';
  if(zc>1.92&&s<=5) return 'bumperF';
  if(zc<-1.95&&s<=5) return 'bumperR';
  if(zc>0.97&&s>=6) return 'hood';
  if(zc<-1.62&&s>=6) return 'trunk';
  if(zc>=0.15&&zc<=0.97){ if(s===8) return 'glassF'; if(s===7) return 'shell'; }
  if(zc>=-1.62&&zc<=-1.0&&s===8) return 'glassR';
  if(s===6&&zc>-1.05&&zc<0.95){ if(zc>-0.42&&zc<-0.27) return 'shell'; return zc>-0.34?'glass'+L+'F':'glass'+L+'R'; }
  if(s>=2&&s<=5&&zc>-1.12&&zc<0.95) return zc>-0.34?'door'+L+'F':'door'+L+'R';

// paint texture: u = along length (rear→front), v = around the cross-section ring
function paintTexture(base){
  return canvasTex(1024,512,(x,w,h)=>{
    const U=z=>(z-ZR)/(ZF-ZR)*w, V=v=>(1-v)*h;
    x.fillStyle=base; x.fillRect(0,0,w,h);
    // sill and underside in black plastic
    x.fillStyle='#232322'; x.fillRect(0,V(VT[2]),w,V(VT[0])-V(VT[2])); x.fillRect(0,V(1),w,V(VT[16])-V(1));
    // panel seams
    x.strokeStyle='rgba(20,20,18,.75)'; x.lineWidth=2;
    const seam=(z,v0,v1)=>{x.beginPath();x.moveTo(U(z),V(v0));x.lineTo(U(z),V(v1));x.stroke();};
    for(const z of [0.95,-0.34,-1.12]){ seam(z,VT[2],VT[6]); seam(z,VT[12],VT[16]); }
    seam(0.97,VT[6],VT[12]); seam(-1.62,VT[6],VT[12]); seam(1.92,VT[0],VT[6]); seam(1.92,VT[12],1); seam(-1.95,VT[0],VT[6]); seam(-1.95,VT[12],1);
    // door handles
    x.fillStyle='rgba(25,25,23,.8)'; for(const z of [0.55,-0.75]){ x.fillRect(U(z),V(lerp(VT[4],VT[5],0.6)),18,5); x.fillRect(U(z),V(lerp(VT[13],VT[14],0.4)),18,5); }
    // photo targets (quartered yellow/black discs) — scaled for the non-uniform u/v density
    const sx=w/(ZF-ZR), sy=h/4.2;
    const target=(z,v,r)=>{ const cx=U(z),cy=V(v); for(let q=0;q<4;q++){ x.fillStyle=q%2?'#161614':'#e3ae1c'; x.beginPath(); x.moveTo(cx,cy); x.ellipse(cx,cy,r*sx,r*sy,0,q*Math.PI/2,(q+1)*Math.PI/2); x.closePath(); x.fill(); } x.strokeStyle='#161614'; x.lineWidth=2; x.beginPath(); x.ellipse(cx,cy,r*sx,r*sy,0,0,Math.PI*2); x.stroke(); };
    for(const v of [lerp(VT[3],VT[4],0.5),lerp(VT[13],VT[14],0.5)]){ target(0.35,v,0.11); target(-0.75,v,0.11); target(-1.6,v,0.09); target(1.55,v,0.09); }
    target(-0.3,0.5,0.13); target(1.45,0.5,0.11);
    // measuring scale on the sill: 100 mm black/white blocks
    for(let z=-1.9,k=0;z<1.9;z+=0.1,k++){ x.fillStyle=k%2?'#efeee8':'#161614'; x.fillRect(U(z),V(VT[2])-6,sx*0.1,6); x.fillRect(U(z),V(VT[16]),sx*0.1,6); }
    // test id
    x.fillStyle='#161614'; x.font='600 22px "IBM Plex Mono", monospace';
    // +x side reads mirrored along u, −x side upside down: pre-flip so both read correctly from outside
    const label=(z,v,fx,fy)=>{ x.save(); x.translate(U(z),V(v)); x.scale(fx,fy); x.textAlign='center'; x.textBaseline='middle';  x.restore(); };
    label(-1.4,lerp(VT[4],VT[5],0.35),-1,1); label(-1.4,lerp(VT[13],VT[14],0.65),1,-1);
  });
}

function buildCarGeometry(){
  const parts={}; const P=n=>parts[n]||(parts[n]={pos:[],uv:[]});
  const rings=[], zs=[];
  for(let i=0;i<=NST;i++){ const z=ZR+(ZF-ZR)*i/NST; zs.push(z); rings.push(ringAt(z)); }
  const tri=(part,a,b,c,ua,ub,uc,ref)=>{ // orient outward relative to ref point
    const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const mx=(a[0]+b[0]+c[0])/3-ref[0],my=(a[1]+b[1]+c[1])/3-ref[1],mz=(a[2]+b[2]+c[2])/3-ref[2];
    const p=P(part); if(nx*mx+ny*my+nz*mz<0){ p.pos.push(...a,...c,...b); p.uv.push(...ua,...uc,...ub);} else { p.pos.push(...a,...b,...c); p.uv.push(...ua,...ub,...uc);} };
  for(let i=0;i<NST;i++){ const zc=(zs[i]+zs[i+1])/2;
    for(let j=0;j<RN;j++){ const j2=(j+1)%RN; const r0=rings[i],r1=rings[i+1];
      const a=[r0[j][0],r0[j][1],zs[i]], b=[r0[j2][0],r0[j2][1],zs[i]], c=[r1[j2][0],r1[j2][1],zs[i+1]], d=[r1[j][0],r1[j][1],zs[i+1]];
      const u0=(zs[i]-ZR)/(ZF-ZR),u1=(zs[i+1]-ZR)/(ZF-ZR), v0=VT[j], v1=j2===0?1:VT[j2];
      const name=classify(zc,segS(j),segSide(j)); const ref=[0,0.72,zc];
      tri(name,a,b,c,[u0,v0],[u0,v1],[u1,v1],ref); tri(name,a,c,d,[u0,v0],[u1,v1],[u1,v0],ref); } }
  for(const [idx,name,sgn] of [[NST,'bumperF',1],[0,'bumperR',-1]]){ const r=rings[idx], z=zs[idx]; let cy=0; r.forEach(p=>cy+=p[1]); cy/=RN; const c=[0,cy,z]; const u=sgn>0?0.995:0.005;
    for(let j=0;j<RN;j++){ const a=[r[j][0],r[j][1],z], b=[r[(j+1)%RN][0],r[(j+1)%RN][1],z]; tri(name,c,a,b,[u,0.5],[u,0.5],[u,0.5],[0,cy,z-sgn]); } }
  return parts;

// ───────────────────────────── deformable part
class Part{
  constructor(name,geo,mat,cfg){
    this.name=name; this.cfg=cfg; this.kind=cfg.kind; this.damage=0; this.gone=false; this.cracked=false;
    const pos=geo.attributes.position.array; const n=pos.length/3;
    this.orig=Float32Array.from(pos); this.tgt=Float32Array.from(pos);
    const col=new Float32Array(n*3).fill(1); geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    this.mesh=new THREE.Mesh(geo,mat); this.mesh.castShadow=cfg.kind!=='glass'; this.mesh.receiveShadow=true; this.mesh.frustumCulled=false;
    let cx=0,cy=0,cz=0; for(let i=0;i<pos.length;i+=3){cx+=pos[i];cy+=pos[i+1];cz+=pos[i+2];} this.center=new THREE.Vector3(cx/n,cy/n,cz/n);

  }

}
