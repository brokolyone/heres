<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a clean camera frame. Wordmark top-left, timecode top-right, speed bottom-right,
   test line bottom-left. No panels: type sits on the footage with a soft shadow. */
:root{
  --ink:#f1efe8;                 /* text on footage */
  --dim:rgba(241,239,232,.62);   /* secondary text */
  --hazard:#e6b01e;              /* test-ground yellow: mark and verdicts only */
  --bad:#e0543a;
  --ok:#9cc46e;
  --sheet:rgba(16,17,16,.86);    /* protocol lower third */
  --shadow:0 1px 2px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.28);
  --cond:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#8f9599;color:var(--ink);font-family:var(--cond);font-size:14px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.locked #gl{cursor:none}
body:not(.live) .hud{display:none!important}
.hud{position:fixed;z-index:2;pointer-events:none;text-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
.mark{display:inline-block;width:30px;height:18px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 5px,#141413 5px 10px);box-shadow:0 1px 3px rgba(0,0,0,.35)}

#brand{top:24px;left:28px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:21px;letter-spacing:.06em}

#tc{top:26px;right:30px;font-family:var(--mono);font-size:12.5px;text-align:right;line-height:1.7;color:var(--ink)}
#tc .rec{color:var(--bad)}
#toast{opacity:0;transition:opacity .3s}
#toast.on{opacity:1}

#speedo{right:30px;bottom:24px;display:flex;align-items:flex-end;gap:14px}
#spd{font-weight:600;font-size:84px;line-height:.82;letter-spacing:-.02em;min-width:2.1ch;text-align:right}
#speedo .side{display:flex;flex-direction:column;gap:4px;padding-bottom:2px;font-family:var(--mono);font-size:12px;color:var(--dim)}
#gear{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1;color:var(--ink)}
#eng{color:var(--hazard)}
#eng.bad{color:var(--bad)}
#dmg{width:44px;height:80px;margin-right:4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

#testline{left:28px;bottom:26px;font-size:17px;font-weight:500;display:flex;gap:14px;align-items:baseline;opacity:0;transition:opacity .35s}
#testline.on{opacity:1}
#testline b{font-weight:600}
#mode{font-family:var(--mono);font-size:12.5px;color:var(--dim)}

#help{left:28px;bottom:70px;font-family:var(--mono);font-size:12.5px;line-height:1.85;display:grid;grid-template-columns:auto auto;gap:0 18px}
#help span:nth-child(odd){color:var(--ink)}#help span:nth-child(even){color:var(--dim)}

#report{left:0;right:0;bottom:0;background:var(--sheet);text-shadow:none;border-top:1px solid rgba(241,239,232,.12);
  display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(320px,1.3fr);gap:36px;align-items:center;padding:18px 30px 20px}
#report .head{display:flex;flex-direction:column;gap:6px;min-width:0}
#rtitle{font-family:var(--mono);font-size:12px;color:var(--dim)}
#rsub{font-size:22px;font-weight:600;line-height:1.1}
#verdict{font-size:15px;font-weight:700;letter-spacing:.08em}
#pulse{width:420px;height:96px;display:block}
#report dl{margin:0;display:grid;grid-template-columns:repeat(3,auto);gap:10px 28px;justify-content:start}
#report dl div{display:flex;flex-direction:column;gap:2px}
#report dt{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
#report dd{margin:0;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
#report .close{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}

#intro{position:fixed;inset:0;z-index:5;cursor:pointer;background:linear-gradient(90deg,rgba(12,13,12,.78) 0%,rgba(12,13,12,.5) 45%,rgba(12,13,12,.05) 80%);
  display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 8vw;text-shadow:var(--shadow)}
#intro .word{display:flex;align-items:center;gap:22px}
#intro .mark{width:64px;height:42px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,#141413 10px 20px)}
#intro h1{margin:0;font-weight:700;font-size:clamp(64px,9vw,148px);line-height:.9;letter-spacing:.03em}
#intro p{margin:0;max-width:56ch;font-size:18px;line-height:1.45;color:var(--ink)}
#intro .keys{display:grid;grid-template-columns:repeat(2,max-content 14ch);gap:7px 16px;justify-content:start;font-family:var(--mono);font-size:13px;max-width:720px}
#intro .keys span:nth-child(odd){color:var(--hazard)}#intro .keys span:nth-child(even){color:var(--dim)}
#start{all:unset;cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--ink);border-bottom:1px solid var(--hazard);padding-bottom:3px;align-self:flex-start}
#start:focus-visible{outline:2px solid var(--hazard);outline-offset:6px}
@media (max-width:1100px){#report{grid-template-columns:1fr auto;gap:14px 28px}#report dl{grid-column:1/-1}#pulse{width:360px;height:82px}}
@media (prefers-reduced-motion:reduce){#toast,#testline{transition:none}}
/* touch controls: only on phones/tablets; icons only, no lettering */
#touch{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
body.touch #touch{display:block}
#touch .pad{position:absolute;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#steer{left:0;bottom:0;width:46%;height:58%}
#steer .ring{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(235,232,223,.35);background:rgba(20,21,19,.18);display:none}
#steer .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(235,232,223,.55)}
#steer.on .ring{display:block}
.pbtn{position:absolute;display:grid;place-items:center;border:2px solid rgba(235,232,223,.4);background:rgba(20,21,19,.32);border-radius:14px}
.pbtn.on{background:rgba(227,174,28,.75);border-color:rgba(227,174,28,.95)}
.pbtn svg{width:46%;height:46%;fill:none;stroke:#ebe8df;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#gas{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:86px;height:128px}
#brk{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:86px;height:92px}
#hbk{right:calc(118px + env(safe-area-inset-right,0px));bottom:calc(126px + env(safe-area-inset-bottom,0px));width:86px;height:48px}
#tools{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;pointer-events:auto}
#tools .pbtn{position:relative;width:46px;height:46px;border-radius:12px}
#look{left:46%;right:0;top:0;bottom:40%}
</style>

const M = (c, o = {}) => STD(c, Object.assign({ vertexColors: true }, o));
const MAT = {
  concrete: M(PALETTE.concrete, { roughness: 0.95 }),
  concreteL: M(0xb4b0a6, { roughness: 0.95 }),

  galv: M(0xa4a9ab, { metalness: 0.6, roughness: 0.4 }),
  black: M(0x1c1c1b, { roughness: 0.75 }),
  yellow: M(PALETTE.hazard, { roughness: 0.6 }),
  rubber: M(PALETTE.rubber, { roughness: 0.95 }),

  $('mode').textContent='тест '+testNo+' · буксир'; $('tname').textContent=cfg.name; $('tspeed').textContent=test.kmh; $('report').hidden=true; toast('тест '+testNo+' · '+cfg.name.toLowerCase());
}
function towStep(dt){

function finishReport(){
  const c=player, I=test.impact; const vms=I.v; const side=test.cfg.id==='side'&&target; const dEff=Math.max(c.frontCrush+(side?target.maxDef:0),0.12);

  const aAvg=vms*vms/((side?4:2)*dEff)/9.81, T=2*dEff/vms, peak=aAvg*Math.PI/2*1.08;

  const verdict= cab<80&&peak<55?['ХОРОШО','var(--ok)']: cab<190&&peak<80?['ПРИЕМЛЕМО','var(--hazard)']:['ПЛОХО','var(--bad)'];
  $('rtitle').textContent='протокол '+String(test.no).padStart(3,'0')+' · задано '+test.kmh+' км/ч'; $('rsub').textContent=test.cfg.name;
  $('r_v').textContent=(vms*3.6).toFixed(1)+' км/ч'; $('r_d').textContent=Math.round(def)+' мм'; $('r_c').textContent=Math.round(cab)+' мм';

function drawPulse(peak,T){

// ───────────────────────────── driving model
const GEARS=[3.5,2.15,1.5,1.15,0.92], FINAL=3.9;
function drive(c,dt){

  let thr=K('KeyW','ArrowUp')?1:0, brk=K('KeyS','ArrowDown')?1:0, st=(K('KeyA','ArrowLeft')?1:0)-(K('KeyD','ArrowRight')?1:0), hb=K('Space');

  // reverse when stopped and holding brake
  let rev=false; if(brk&&sp<1.2){ rev=true; thr=brk; brk=0; }
  const maxSt=0.6/(1+Math.abs(sp)/22); c.steer+= (st*maxSt-c.steer)*Math.min(1,dt*7);
  v.setSteeringValue(c.steer+c.toe,0); v.setSteeringValue(c.steer+c.toe,1);
  // gearbox + torque curve

  if(rpm>6300&&c.gear<4) c.gear++; else if(rpm<2300&&c.gear>0) c.gear--;

  let F=tq*(rev?3.2:GEARS[c.gear])*FINAL*0.88/0.33; F*=thr;
  if(rev) F=-Math.min(F,3500);
  for(let i=0;i<4;i++){ const drv=i>=2; v.applyEngineForce(drv?-F/2:0,i); v.setBrake(0,i); }
  if(brk){ for(let i=0;i<4;i++) v.setBrake(i<2?34:24,i); }
  else if(!thr){ for(let i=0;i<4;i++) v.setBrake(1.2,i); }
  if(hb){ v.setBrake(60,2); v.setBrake(60,3); v.applyEngineForce(0,2); v.applyEngineForce(0,3); }

}
